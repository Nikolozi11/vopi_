services:
  - type: web
    name: student-dashboard
    env: php
    region: frankfurt
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && npm install && npm run build"
    startCommand: "vendor/bin/heroku-php-apache2 public/"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr